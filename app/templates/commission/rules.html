{% extends 'base.html' %} {% block content %}
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .com-wrap{ --paper:#F6F1E6; --paper-raised:#FBF8F1; --ink:#1E2A38; --ink-soft:#5B6677; --navy:#16233A;
    --brass:#A8762E; --sage:#4C7A63; --sage-bg:#E4EFE8; --hairline:#D9CFB8; --radius:6px;
    background:var(--paper); padding:20px; border-radius:8px; }
  .com-wrap .serif{ font-family:'Noto Serif Thai', serif; }
  .com-wrap .mono{ font-family:'IBM Plex Mono', monospace; }
  .com-nav{ display:flex; gap:8px; margin-bottom:18px; }
  .com-nav a{ padding:8px 14px; border-radius:20px; font-size:13px; text-decoration:none; border:1px solid var(--hairline); color:var(--ink-soft); }
  .com-nav a.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .com-card{ background:var(--paper-raised); border:1px solid var(--hairline); border-radius:var(--radius); padding:16px 20px; margin-bottom:20px; }
  .com-policy{ margin-bottom:22px; }
  .com-policy-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .com-num{ width:28px; height:28px; border-radius:50%; border:1.5px solid var(--brass); color:var(--brass);
    font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex:0 0 28px; }
  .com-policy-head h4{ margin:0; font-size:15px; flex:1; }
  .com-subtotal{ color:var(--brass); font-size:12.5px; }
  .com-row{ border-top:1px solid var(--hairline); padding:10px 4px; display:grid;
    grid-template-columns:52px 1fr 100px 130px 70px 28px; gap:10px; align-items:center; font-size:13px; }
  .com-row .code{ color:var(--ink-soft); font-size:12px; }
  .com-stamp{ font-size:10px; border:1px dashed var(--brass); color:var(--brass); padding:2px 6px; border-radius:3px; text-align:center; white-space:nowrap; }
  .com-rate{ display:flex; align-items:center; gap:4px; }
  .com-rate input{ width:70px; text-align:right; }
  .com-alloc{ grid-column:1/-1; background:var(--paper); border:1px dashed var(--hairline); border-radius:4px; padding:10px 12px; margin-top:6px; }
  .com-alloc .arow{ display:flex; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid var(--hairline); font-size:13px; }
  .com-alloc .arow .aname{ flex:1; }
  .com-alloc .apct{ color:var(--brass); }
  .com-empty{ font-size:12px; color:var(--ink-soft); font-style:italic; }
  .com-btn{ border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:4px; padding:6px 12px; font-size:12.5px; cursor:pointer; }
  .com-btn.ghost{ background:transparent; color:var(--navy); }
  .com-expand{ background:none; border:none; cursor:pointer; color:var(--ink-soft); }
  .com-grand{ text-align:right; }
  .com-grand .val{ font-size:22px; font-weight:600; }
</style>

<div class="com-wrap">
  <div class="com-nav">
    <a href="/commission/rules" class="active">01 ตั้งค่าตามสินค้า</a>
    <a href="/commission/payees">02 ผู้รับเงิน</a>
    <a href="/commission/bills">03 บิลขาย · กำหนดค่าคอม</a>
    <a href="/commission/listall">04 บิลทั้งหมด</a>
  </div>

  <div class="com-card" style="display:flex; align-items:center; justify-content:space-between; gap:14px;">
    <div>
      <div class="serif" style="font-size:20px; font-weight:700;">ตั้งค่าค่าคอมตามสินค้า</div>
      <div style="font-size:12.5px; color:var(--ink-soft); margin-top:4px;">โครงสร้างนโยบายทั้ง 4 คงที่ ปรับได้เฉพาะอัตราและผู้รับต่อสินค้า — อัตรานี้เป็นค่าเริ่มต้น จะถูกคัดลอกไปเป็นแผนค่าคอมของบิลตอนขายสำเร็จ</div>
    </div>
    <select id="courseSelect" class="form-select" style="width:320px;">
      <option value="">-- เลือกสินค้า --</option>
      {% for c in courses %}
      <option value="{{ c.course_id }}">{{ c.course_code }} — {{ c.course_name }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="policyTree"></div>
</div>

<script>
const csrfSafeFetch = (url, body) => fetch(url, {
  method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
}).then(r => r.json());

const USERS = {{ users_json|safe }};

let currentCourseId = null;

document.getElementById('courseSelect').addEventListener('change', e => {
  currentCourseId = e.target.value;
  if (currentCourseId) loadRules();
  else document.getElementById('policyTree').innerHTML = '';
});

function fmtPct(n){ return (Math.round((n||0)*1000)/1000).toString(); }

async function loadRules(){
  const data = await csrfSafeFetch('/api/commission/rules/list', {course_id: currentCourseId});
  renderTree(data.policies);
}

function renderTree(policies){
  const html = policies.map(p => {
    const subtotal = p.conditions.reduce((s,c)=> s + (c.active && c.rate ? c.rate : 0), 0);
    const rows = p.conditions.map(c => {
      const allocRows = (c.allocations||[]).map(a => `
        <div class="arow"><span class="aname">${a.payee_name}</span><span class="apct">${fmtPct(a.percent)}%</span>
        <button class="com-btn ghost" onclick="rmAllocation(${a.alloc_id})">ลบ</button></div>`).join('')
        || `<div class="com-empty">ยังไม่กำหนดผู้รับ — ค่าคอมทั้งเงื่อนไขจะรอผูกผู้รับภายหลัง</div>`;
      return `
      <div class="com-row" data-condition="${c.condition_id}" data-rule="${c.rule_id||''}">
        <span class="code mono">${c.condition_code}</span>
        <span>${c.condition_name}</span>
        <span class="com-stamp mono">${c.calc_type}</span>
        <span class="com-rate">
          <input type="number" class="form-control form-control-sm mono" step="0.001" min="0"
            value="${c.rate ?? ''}" onchange="saveRate(${c.condition_id}, this.value, this.closest('.com-row'))">
          <span class="mono">%</span>
        </span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" ${c.active?'checked':''}
            onchange="saveActive(${c.condition_id}, this.checked)">
        </div>
        <button class="com-expand" onclick="toggleAlloc(this)">▸</button>
        <div class="com-alloc" style="display:none;">
          ${allocRows}
          <div style="display:flex; gap:8px; margin-top:8px;">
            <select class="payee-select" style="flex:1;"><option value=""></option></select>
            <input type="number" class="form-control form-control-sm pct-input" style="width:90px;" placeholder="%">
            <button class="com-btn" onclick="addAllocation(this, ${c.condition_id})">+ เพิ่มผู้รับ</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `
    <div class="com-policy">
      <div class="com-policy-head">
        <span class="com-num serif">${p.policy_code}</span>
        <h4 class="serif">${p.policy_name}</h4>
        <span class="com-subtotal mono">รวม ${fmtPct(subtotal)}%</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
  document.getElementById('policyTree').innerHTML = html;
  $('.payee-select').select2({
    placeholder: '-- เลือกผู้รับ --', allowClear: true, width: '100%',
    data: USERS.map(u => ({ id: u.id, text: u.name })),
  });
}

function toggleAlloc(btn){
  const panel = btn.parentElement.querySelector('.com-alloc');
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '▸' : '▾';
}

async function saveRate(conditionId, value, rowEl){
  const res = await csrfSafeFetch('/api/commission/rules/save', {
    course_id: currentCourseId, condition_id: conditionId, rate: value === '' ? null : Number(value)});
  rowEl.dataset.rule = res.rule_id;
  loadRules();
}
async function saveActive(conditionId, checked){
  await csrfSafeFetch('/api/commission/rules/save', {course_id: currentCourseId, condition_id: conditionId, active: checked});
  loadRules();
}
async function addAllocation(btn, conditionId){
  const panel = btn.closest('.com-alloc');
  const rowEl = btn.closest('.com-row');
  let ruleId = rowEl.dataset.rule;
  if(!ruleId){
    const res = await csrfSafeFetch('/api/commission/rules/save', {course_id: currentCourseId, condition_id: conditionId});
    ruleId = res.rule_id;
  }
  const userId = $(panel.querySelector('.payee-select')).val();
  const percent = panel.querySelector('.pct-input').value;
  if(!userId || !percent) return;
  await csrfSafeFetch('/api/commission/rules/allocation/add', {rule_id: ruleId, user_id: userId, percent: Number(percent)});
  loadRules();
}
async function rmAllocation(allocId){
  await csrfSafeFetch('/api/commission/rules/allocation/delete', {alloc_id: allocId});
  loadRules();
}
</script>
{% endblock %}
