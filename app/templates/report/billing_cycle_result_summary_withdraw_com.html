{% extends 'base.html' %} {% block content %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

 function validateForm() {
  

         let timerInterval;
Swal.fire({
  title: "รอสักครู่",
  html: "I will close in <b></b> milliseconds.",
  timer: 1000,
  timerProgressBar: true,
  didOpen: () => {
    Swal.showLoading();
    const timer = Swal.getPopup().querySelector("b");
    timerInterval = setInterval(() => {
      timer.textContent = `${Swal.getTimerLeft()}`;
    }, 300);
  },
  willClose: () => {
    clearInterval(timerInterval);
  }
}).then((result) => {
  /* Read more about handling dismissals below */
  if (result.dismiss === Swal.DismissReason.timer) {
    console.log("I was closed by the timer");
  }
});
  return true; // Prevent submission

  }

  function default_date() {
    const d = new Date();
    let month = d.getMonth() + 1;
    let year = d.getFullYear();
    let formattedNumberMonth = month.toLocaleString("en-US", {
      minimumIntegerDigits: 2,
      useGrouping: false,
    });

    const url = new URL(location.href);
    //alert(url.searchParams.get("qteacher"));
    let qyear = url.searchParams.get("qyear");

    if (qyear !== null) {
      document.getElementById("qyear").value = qyear;
    } else {
      document.getElementById("qyear").value = year;
    }
  }
  window.onload = default_date;
</script>

<div class="row">
  <div class="col-12 col-md-6 order-md-1 order-last">
    <h3>สรุปรายชื่อตั้งเบิกค่า</h3>
  </div>
  <div class="col-12 col-md-6 order-md-2 order-first">
    <nav
      aria-label="breadcrumb"
      class="breadcrumb-header float-start float-lg-end"
    >
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="/">หน้าหลัก</a>
        </li>

        <li class="breadcrumb-item active" aria-current="page">
          สรุปรายชื่อตั้งเบิกค่าcom
        </li>
      </ol>
    </nav>
  </div>
</div>

<section class="section">
  <div class="card">
    <div class="card-body">
      <form
        method="post"
        action="/report/withdraw/all/withdraw/comm"
        autocomplete="off"
        target="iframe_target" 
        onsubmit="return validateForm()"
      >
        {% csrf_token %}
        <div class="row">
         
          <div class="col-lg-4 col-md-6 mb-4">
             <label for="exampleFormControlInput1" class="form-label">วันที่ค้นหา</label>
          <input
          type="number"
          class="form-control"
          id="qyear"
          name="qyear"
          required
          placeholder="ปี (ค.ศ.)"
        />
          </div>


               <div class="col-lg-4 col-md-6 mb-4">
             <label for="exampleFormControlInput1" class="form-label">เดือน</label>
                <select name="monthss" id="monthss" class="form-control">
                  {% for value, display in thai_months %}
        <option value="{{ value }}"  {% if value == current_month %}selected{% endif %} >
            {{ display }}
        </option>
    {% endfor %}
  
            </select>

            
   
          </div>



 



          
        </div>
        <div class="form-goup" align="center" style="padding-top: 25px">
          <button type="submit" class="btn btn-success">
            <i class="icon dripicons-experiment"></i>
            กรอง
          </button>

          <button
            type="button"
            class="btn btn-warning"
            onclick="window.location.href='/register/export/bill'"
          >
            <i class="icon dripicons-clockwise"></i>
            รีเซ็ต
          </button>
        </div>
      </form>
    </div>
  </div>

  <iframe
id="iframe_target"
name="iframe_target"
src="/report/withdraw/all/withdraw/comm"
style="height: 1000px; width: 100%; border: thin; background-color: #fff"
></iframe>
</section>
