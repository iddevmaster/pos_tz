    async function findcommit(register_id,ev_id) {

                    $row.append($statusTd);
                    
                    $tableBody.append($row);

                    if(item.s_name == 'ยืนยันแล้ว'){
                    $selectElement.prop('disabled', true);
                    }
                    
                    $selectElement.select2({
                        data: statusOptions, // Provide the status options
                        placeholder: "Select Status",
                        allowClear: true
                    }).val(item.user_id).trigger('change'); // Set initial value and trigger change to display it


                     $selectElement.on('change', function() {

    };

        data: JSON.stringify(dataToSend),
        success: function(response) {
            console.log('API update successful:', response);
            // Optionally, show a success message to the user
        },
        error: function(xhr, status, error) {

            // You might want to revert the selection or show a warning
        }
    });
                    
                     });

      });

    } catch (error) {
      console.error("Error fetching data:", error);
    }
  }



  async function populateTable() {
    try {
        const response = await fetch('/api/calendar_event_api_user', {
        method: 'POST', // Specify the HTTP method as POST
        headers: {
          'Content-Type': 'application/json' // Tell the server we're sending JSON

        },
        body: JSON.stringify({ // Convert your JavaScript object to a JSON string
          // Your data goes here
          register_id: register_id,
          ev_id:1
        })
      });

        
        // Check if the request was successful (status code 200-299)
        if (!response.ok) {
            // If not successful, throw an error with the status
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        // Parse the JSON response
        const data = await response.json();

        // --- Now you have the data! ---
        console.log("Fetched Calendar Events:", data);


        return data; // Return the fetched data
    } catch (error) {
        console.error("Error fetching calendar events:", error);
        // Handle the error appropriately, e.g., display an error message to the user
        return null; // Or re-throw the error
    }
}


  async function findevid(evid) {


    const table = document.getElementById('ttt');
    table.style.display = 'block';

    try {
      const response = await fetch('/api/calendar_event_api_billevent', {
        method: 'POST', // Specify the HTTP method as POST
        headers: {
          'Content-Type': 'application/json' // Tell the server we're sending JSON
          // You might need other headers like 'Authorization' if your API requires it
        },
        body: JSON.stringify({ // Convert your JavaScript object to a JSON string
          // Your data goes here
          evid: evid,
        })
      });
      const data = await response.json();
      
      const tableBody = document.getElementById('json-table-body');
      tableBody.innerHTML = ''; // Clears all rows
      data.forEach((item, index) => {

        const row = document.createElement('tr');

             row.innerHTML = `
                    <td>${index + 1}</td>
                      <td> ${item.crt_date}</td>
                    <td>${item.register_number}</td>
                    <td>${item.rp_name_customer}</td>
                    <td>${item.tel}</td>  
                    <td>${item.seller}</td>
                      
                 
                `;
        tableBody.appendChild(row);
      });

    } catch (error) {
      console.error("Error fetching data:", error);
    }
  }
