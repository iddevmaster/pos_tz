{% extends 'base.html' %} {% block content %}










<div class="row">
  <div class="col-12 col-md-6 order-md-1 order-last">
    <h3>รายงานค่าตอบแทน</h3>
  </div>
  <div class="col-12 col-md-6 order-md-2 order-first">
    <nav
      aria-label="breadcrumb"
      class="breadcrumb-header float-start float-lg-end"
    >
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="/">หน้าหลัก</a>
        </li>

        <li class="breadcrumb-item active" aria-current="page">
          รายงานค่าตอบแทน
        </li>
      </ol>
    </nav>
  </div>
</div>

<section class="section">
  <div class="card">
    <div class="card-body">
      <form
        method="post"
        action="/report/teacher/export/withdraw"
        autocomplete="off"
        target="iframe_target"
      >
        {% csrf_token %}
        <div class="row">
          <div class="col-lg-4 col-md-6 mb-4">
            <input
              type="text"
              class="form-control daterange"
              id="date_range"
              name="date_range"
              required
              value="{{daterange}}"
            />
          </div>

 
   


          
        </div>
        <div class="form-goup" align="center" style="padding-top: 25px">
          <button type="submit" class="btn btn-success">
            <i class="icon dripicons-experiment"></i>
            กรอง
          </button>

          <button
            type="button"
            class="btn btn-warning"
            onclick="window.location.href='/register/export/bill'"
          >
            <i class="icon dripicons-clockwise"></i>
            รีเซ็ต
          </button>
        </div>
      </form>
    </div>
  </div>

  <iframe
id="iframe_target"
name="iframe_target"
src="/report/teacher/export/withdraw/onemore"
style="height: 1000px; width: 100%; border: thin; background-color: #fff"
></iframe>
</section>


{% endblock %}
