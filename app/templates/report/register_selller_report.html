{% extends 'base.html' %}{% block content %}

<style>
.filter-card {
  background: var(--card); border: 1px solid var(--bdr);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 20px;
}
.filter-card-head {
  padding: 12px 18px; background: var(--card2);
  border-bottom: 1px solid var(--bdr);
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 700; color: var(--t1);
}
.filter-card-body { padding: 18px 20px; }
.filter-card-foot {
  padding: 12px 20px; background: var(--card2);
  border-top: 1px solid var(--bdr);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.form-label { font-size: 12px; font-weight: 600; color: var(--t2); margin-bottom: 4px; }
.form-control, .form-select {
  border: 1px solid var(--bdr2); background: var(--card2); color: var(--t1);
  border-radius: 8px; font-size: 13px;
}
.form-control:focus, .form-select:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,110,247,.15);
  background: var(--card); color: var(--t1); outline: none;
}

.report-frame {
  background: var(--card); border: 1px solid var(--bdr);
  border-radius: var(--radius); overflow: hidden;
}
.report-frame-head {
  padding: 10px 18px; background: var(--card2);
  border-bottom: 1px solid var(--bdr);
  font-size: 13px; font-weight: 600; color: var(--t2);
  display: flex; align-items: center; gap: 8px;
}
</style>

<!-- Breadcrumb + Header -->
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-1">
        <li class="breadcrumb-item"><a href="/">หน้าหลัก</a></li>
        <li class="breadcrumb-item active">รายงานข้อมูลการขาย</li>
      </ol>
    </nav>
    <h5 class="mb-0 fw-bold" style="color:var(--t1);">
      <i class="bi bi-bar-chart-line-fill" style="color:var(--blue)"></i>
      รายงานข้อมูลการขาย
    </h5>
  </div>
</div>

<!-- Filter Form -->
<div class="filter-card">
  <div class="filter-card-head">
    <i class="bi bi-funnel-fill" style="color:var(--blue)"></i>
    ตัวกรองข้อมูล
  </div>
  <form method="post" action="/register/excel/seller" autocomplete="off" target="iframe_target">
    {% csrf_token %}
    <div class="filter-card-body">
      <div class="row g-3">

        <!-- ช่วงวันที่ -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-calendar-range"></i> ช่วงวันที่</label>
          <input type="text" class="form-control daterange" id="date_range" name="date_range"
                 value="{{ daterange }}" required>
        </div>

        <!-- สินค้า -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-box-seam"></i> สินค้า</label>
          <select class="form-select select2" name="qcourse">
            <option value="0">— ทุกสินค้า —</option>
            {% for c in course_list %}
            <option value="{{ c.course_id }}">{{ c.course_code }} {{ c.course_name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- ประเภทการชำระ -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-credit-card"></i> ประเภทการชำระ</label>
          <select class="form-select" name="qpay_type">
            <option value="0">— ทุกประเภท —</option>
            <option value="1">เงินสด</option>
            <option value="2">เครดิต</option>
          </select>
        </div>

        <!-- กลุ่มลูกค้า -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-people"></i> กลุ่มลูกค้า</label>
          <select class="form-select" name="qcustomer_type">
            <option value="0">— ทุกประเภท —</option>
            <option value="1">บุคคลธรรมดา</option>
            <option value="2">นิติบุคคล / บริษัท</option>
          </select>
        </div>

        <!-- สถานะบิล (Y/W/N) -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-receipt"></i> สถานะบิล</label>
          <select class="form-select" name="qstatus">
            <option value="">— ทุกสถานะ —</option>
            <option value="Y">เงินสด / สำเร็จ (Y)</option>
            <option value="W">เครดิต / รอยืนยัน (W)</option>
           
          </select>
        </div>

        <!-- ชื่อลูกค้า -->
        <div class="col-lg-3 col-md-6">
          <label class="form-label"><i class="bi bi-search"></i> ชื่อลูกค้า</label>
          <input type="text" class="form-control" name="qcustomer_name" placeholder="ค้นหาชื่อลูกค้า">
        </div>

      </div>
    </div>
    <div class="filter-card-foot">
      <button type="submit" class="btn btn-primary btn-sm">
        <i class="bi bi-funnel"></i> กรองข้อมูล
      </button>
      <button type="button" class="btn btn-secondary btn-sm"
              onclick="window.location.href='/report/register/export/seller'">
        <i class="bi bi-arrow-counterclockwise"></i> รีเซ็ต
      </button>
    </div>
  </form>
</div>

<!-- Report Frame -->
<div class="report-frame">
  <div class="report-frame-head">
    <i class="bi bi-table" style="color:var(--blue)"></i>
    ผลลัพธ์รายงาน — กด <strong>กรองข้อมูล</strong> เพื่ออัปเดต
  </div>
  <iframe id="iframe_target" name="iframe_target"
          src="/register/excel/seller"
          style="height:600px; width:100%; border:none; background:#f5f6fa;">
  </iframe>
</div>

{% endblock %}
