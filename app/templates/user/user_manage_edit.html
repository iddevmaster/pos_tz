{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div class="page-title-headings"><div><h3>แก้ไขผู้ใช้งาน</h3><p class="text-muted mb-0">{{ account.username }}</p></div><nav class="breadcrumb-header"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="{% url 'user_manage_list' %}">จัดการผู้ใช้งาน</a></li><li class="breadcrumb-item active">แก้ไข</li></ol></nav></div></div>
<section class="section"><form method="post" autocomplete="off">{% csrf_token %}
  <div class="card"><div class="card-header"><h4 class="card-title"><i class="bi bi-person-gear me-2"></i>ข้อมูลบัญชี</h4></div><div class="card-body"><div class="row g-3">
    <div class="col-md-6"><label class="form-label">Username <span class="text-danger">*</span></label><input class="form-control" name="username" required value="{% if request.method == 'POST' %}{{ request.POST.username }}{% else %}{{ account.username }}{% endif %}"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{% if request.method == 'POST' %}{{ request.POST.email }}{% else %}{{ account.email }}{% endif %}"></div>
    <div class="col-md-6"><label class="form-label">ชื่อ <span class="text-danger">*</span></label><input class="form-control" name="first_name" required value="{% if request.method == 'POST' %}{{ request.POST.first_name }}{% else %}{{ account.first_name }}{% endif %}"></div>
    <div class="col-md-6"><label class="form-label">นามสกุล <span class="text-danger">*</span></label><input class="form-control" name="last_name" required value="{% if request.method == 'POST' %}{{ request.POST.last_name }}{% else %}{{ account.last_name }}{% endif %}"></div>
    <div class="col-md-6"><label class="form-label">กลุ่มผู้ใช้งาน <span class="text-danger">*</span></label><select class="form-select select2" name="category" required><option value=""></option>{% for item in categories %}<option value="{{ item.pk }}" {% if request.method == 'POST' and request.POST.category == item.pk|stringformat:'s' or request.method != 'POST' and current_category_id == item.pk %}selected{% endif %}>{{ item.cm_name }}</option>{% endfor %}</select></div>
    <div class="col-md-3 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" name="is_active" value="1" id="editIsActive" {% if account.pk == user.pk or request.method != 'POST' and account.is_active or request.method == 'POST' and request.POST.is_active == '1' %}checked{% endif %} {% if account.pk == user.pk %}disabled{% endif %}><label class="form-check-label" for="editIsActive">เปิดใช้งาน</label></div></div>
    <div class="col-md-3 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" name="is_staff" value="1" id="editIsStaff" {% if account.pk == user.pk or request.method != 'POST' and account.is_staff or request.method == 'POST' and request.POST.is_staff == '1' %}checked{% endif %} {% if account.pk == user.pk %}disabled{% endif %}><label class="form-check-label" for="editIsStaff">สิทธิ์ Staff</label></div></div>
  </div></div></div>
  <div class="card"><div class="card-header"><h4 class="card-title">เปลี่ยนรหัสผ่าน</h4></div><div class="card-body"><p class="text-muted">เว้นว่างไว้หากไม่ต้องการเปลี่ยนรหัสผ่าน</p><div class="row g-3"><div class="col-md-6"><label class="form-label">รหัสผ่านใหม่</label><input class="form-control" type="password" name="new_password" autocomplete="new-password"></div><div class="col-md-6"><label class="form-label">ยืนยันรหัสผ่านใหม่</label><input class="form-control" type="password" name="new_password_confirm" autocomplete="new-password"></div></div></div></div>
  <div class="card"><div class="card-body text-end"><a class="btn btn-light-secondary me-2" href="{% url 'user_manage_list' %}">ยกเลิก</a><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>บันทึกการแก้ไข</button></div></div>
</form></section>
{% endblock %}
