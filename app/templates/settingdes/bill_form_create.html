<script>

function allowOnlyNumbers(event) {

if (
event.key === "Backspace" || 
event.key === "Tab" || 
event.key === "ArrowLeft" || 
event.key === "ArrowRight" || 
event.key === "Delete"
) {
return true; // Allow default behavior
}

// Allow only numbers (0-9)
if (!/^\d$/.test(event.key)) {
event.preventDefault(); // Block other characters
return false; // Prevent default behavior
}


setTimeout(() => {
const it = document.getElementById("tax").value;
if (it.charAt(0) == "0") {
if (it.charAt(1)) {
let result = removeFirstCharacter(it);
document.getElementById("tax").value = result 
}
}
}, 20);
}



    async function savebill() {

 const isChecked = checkbox.checked;

 if (isChecked) {
   var is_show_signature = 1
} else { 
   var is_show_signature = 0
   
}

 let data = await fetch('/api/savesettingbill', {
   method: 'POST',
   headers: {
       'Content-Type': 'application/json',
   },
   body: JSON.stringify({'bill_id':bill_id,'is_show_signature':is_show_signature})
   })
   .then(response => response.json())
   .then(data => {

      title: 'บันทึก',

      icon: 'success',

    });
   })
   
   
 
 }

  </script>
