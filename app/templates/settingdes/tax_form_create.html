{% extends 'base.html' %} {% block content %} {% load humanize %}
<script>

function allowOnlyNumbers(event) {

if (
event.key === "Backspace" || 
event.key === "Tab" || 
event.key === "ArrowLeft" || 
event.key === "ArrowRight" || 
event.key === "Delete"
) {
return true; // Allow default behavior
}

// Allow only numbers (0-9)
if (!/^\d$/.test(event.key)) {
event.preventDefault(); // Block other characters
return false; // Prevent default behavior
}


setTimeout(() => {
const it = document.getElementById("tax").value;
if (it.charAt(0) == "0") {
if (it.charAt(1)) {
let result = removeFirstCharacter(it);
document.getElementById("tax").value = result 
}
}
}, 20);
}



    async function save() {
 
 const tax_id = document.getElementById("tax_id").value;
 const tax = document.getElementById("tax").value;



 let data = await fetch('/api/savetax', {
   method: 'POST',
   headers: {
       'Content-Type': 'application/json',
   },
   body: JSON.stringify({'tax_id':tax_id,'tax':tax})
   })
   .then(response => response.json())
   .then(data => {
    Swal.fire({
      title: 'บันทึก',
      text: 'บันทึกสำเร็จ',
      icon: 'success',
      confirmButtonText: 'OK'
    });
   })
   
   
 
 }

  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<div class="row">
  <div class="col-12 col-md-6 order-md-1 order-last">
    <h3>ตั้งค่าภาษี</h3>
  </div>
  <div class="col-12 col-md-6 order-md-2 order-first">
    <nav
      aria-label="breadcrumb"
      class="breadcrumb-header float-start float-lg-end"
    >
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="/">หน้าหลัก</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">
          ตั้งค่าภาษี
        </li>
      </ol>
    </nav>
  </div>
</div>

<section class="section">
  <div class="card">
    <div class="card-body">

        {% csrf_token %}

        <input type="hidden" class="form-control" name="tax_id" id="tax_id"  value="{{tax_id}}"  required  />
        <div class="row">
          <div class="col-12 col-lg-12 col-md-12">
            ภาษี % <label style="color: red"> *</label>
            <input type="text" class="form-control" name="tax" id="tax"  value="{{tax}}"  required   onkeydown="allowOnlyNumbers(event)" />
          </div>
        </div>
        <div style="padding-top: 25px" align="center">
          <button type="submit" class="btn btn-primary ml-1" onclick="save()">
            <i class="bx bx-check d-block d-sm-none"></i>

          </button>
        </div>

    
    </div>
  </div>







</section>
