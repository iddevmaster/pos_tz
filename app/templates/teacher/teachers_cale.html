  async function ConfirmJob() {
    const it = document.getElementById("evs_id").value;
    fetch('/api/updateeve', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ 'evs_id': it })
    })
      .then(response => response.json())
      .then(data => {
        // Display response
        calendar.render();
      })
      .catch(error => {
        console.error('Error:', error);
      });


  }

<div class="row">

<input type="text" class="form-control" name="teacher_id" id="teacher_id" value="{{teacher_id}}" />

      <span id="msg" style="color: red"></span>
      <div id="calendar"></div>
    </div>
  </div>
</section>
<div class="row"  id="cardContainer">



</div>


<div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalLabel">Event Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" class="form-control" name="evs_id" id="evs_id" value="" />
        <input type="text" class="form-control" name="evs_status" id="evs_status" value="" />

        <p><strong>Title:</strong> <span id="modalTitle"></span></p>
        <p><strong>Start:</strong> <span id="modalStart"></span></p>
        <p><strong>End:</strong> <span id="modalEnd"></span></p>
      </div>
      <div class="modal-footer" id="bt_confirm">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="confirm()">รับงาน</button>
      </div>
    </div>
  </div>
</div>
