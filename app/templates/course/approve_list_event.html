        }
    });
});

function calen() {

    var calendarEl = document.getElementById("calendar");

    var calendar = new FullCalendar.Calendar(calendarEl, {
      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,timeGridDay,listMonth",
      },
      {% comment %} initialDate: "2020-09-12", {% endcomment %}
      locale: "th",
      buttonIcons: false, // show the prev/next text
      weekNumbers: true,
      navLinks: true, // can click day/week names to navigate views
      editable: false,
      dayMaxEvents: true, // allow "more" link when too many events
      events: {
        url: "/calendar_event_apieve/",
        failure: function () {
          document.getElementById("msg").innerHTML  = "..เชื่อมต่อ API ไม่ได้";
        },
      },
      eventClick: function (info) {
        document.getElementById('eventModalLabel').innerText = info.event.title;
      document.getElementById("evs_id").value = info.event.extendedProps.evs_id
      document.getElementById("evs_status").value = info.event.extendedProps.evs_status


      if(info.event.extendedProps.evs_status){
        document.getElementById("bt_confirm").style.display = "none";
      }else {
        document.getElementById("bt_confirm").style.display = "block";
      }
      
        const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
        eventModal.show();

},
      
    });
    calendar.render();
 

}
