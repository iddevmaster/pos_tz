<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>

$(document).ready(function () {
    // Initialize Select2
    $('#teacher').select2({
        dropdownParent: $('#select2Modal') // Ensures Select2 dropdown stays within modal
    });

    // Reinitialize Select2 when modal is opened (optional, but ensures reliability)
    $('#select2Modal').on('shown.bs.modal', function () {
        $('#teacher').select2({
            dropdownParent: $('#select2Modal')
        });
    });
});



  


  document.addEventListener("DOMContentLoaded", function () {
    var calendarEl = document.getElementById("calendar");

    const path = window.location.pathname; // This will give you "/calendar/2"
    console.log(path)

    const pathSegments = path.split('/');
// pathSegments will be: ["", "calendar", "2"]

// The dynamic parameter (the '2') is the last element in this array.
// We also need to make sure it's not an empty string if the URL ends with a slash.
const lastSegment = pathSegments[pathSegments.length - 1];

let id = null;
if (lastSegment !== "") { // Check to ensure the last segment isn't an empty string (e.g., if URL was /calendar/)
  id = parseInt(lastSegment); // Convert it to a number
}

console.log('Full Path:', path);
console.log('Path Segments:', pathSegments);
console.log('Extracted ID:', id); // Output: 2

    var calendar = new FullCalendar.Calendar(calendarEl, {
      headerToolbar: {
        left: "prev,next today",
        center: "title",
        right: "dayGridMonth,timeGridWeek,timeGridDay,listMonth",
      },
      {% comment %} initialDate: "2020-09-12", {% endcomment %}
      locale: "th",
      buttonIcons: false, // show the prev/next text
      weekNumbers: true,
      navLinks: true, // can click day/week names to navigate views
      editable: false,
      dayMaxEvents: true, // allow "more" link when too many events
      events: {
        url: "/calendar_event_api_register/"+id,
        failure: function () {
          document.getElementById("msg").innerHTML  = "..เชื่อมต่อ API ไม่ได้";
        },
      },
      eventClick: function (info) {
    
        window.location.href= '/formregister/course/list/'+info.event.extendedProps.cre_id
      },
      
    });
    calendar.render();
  });

  









</script>
