 // Populate modal with event data

   async function CheckHourbeforeSave() {


const ev_id = document.getElementById("ev_id").value;
const pi = document.getElementById("pi").value
const tis_quantity = document.getElementById("tis_quantity").value;
const teacher_id = document.getElementById("teacher_id").value


let data = await fetch('/api/checkhours', {
method: 'POST',
headers: {
    'Content-Type': 'application/json',
},
body: JSON.stringify({'pi':pi,'tis_quantity':parseInt(tis_quantity),'ev_id':parseInt(ev_id),'teacher_id':teacher_id})
})
.then(response => response.json())
.then(data => {
    // Display response
   
    document.getElementById("status_hour").value = data.status_hour;
    document.getElementById("status_people").value = data.status_people;
    document.getElementById("status_teacher").value = data.status_teacher;

})
.catch(error => {
   
  
});

return data
}
